version: 2

project_name: terraform-provider-trufo

builds:
  - env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    binary: terraform-provider-trufo
    ldflags:
      - -s -w -X main.version={{.Version}}
    mod_timestamp: '{{ .CommitTimestamp }}'

archives:
  - formats: [zip]
    name_template: '{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}'

checksum:
  # The Terraform Registry requires the release to contain a SHA256SUMS file.
  name_template: 'SHA256SUMS'

# Optional commit/tag signing with cosign once keys are configured:
# signs:
#   - artifacts: checksum
#     cmd: cosign
#     args: ['sign-blob', '--yes', '${artifact}']
#     output: '${artifact}.sig'

release:
  github:
    owner: NitriKx
    name: terraform-provider-trufo

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'
