name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache-dependency-path: |
            go.sum
            trufo-go/go.sum
      - name: Build (provider + client)
        run: |
          go build ./...
          (cd trufo-go && go build ./...)
      - name: Unit tests (provider)
        run: go test ./...
      - name: Unit tests (trufo-go)
        working-directory: trufo-go
        run: go test ./...
      - name: gofmt
        run: |
          test -z "$(gofmt -l .)"
          test -z "$(cd trufo-go && gofmt -l .)"
      - name: go vet
        run: |
          go vet ./...
          (cd trufo-go && go vet ./...)

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
      - name: Generate docs and check they are up to date
        run: |
          go run github.com/hashicorp/terraform-plugin-docs/cmd/tfplugindocs generate --provider-name trufo-ai
          test -z "$(git status --porcelain docs examples templates)"

  acceptance:
    # Manual only: needs Trufo credentials as repository secrets.
    # secrets: TRUFO_TEST_API_KEY (gproduct-admin), TRUFO_ACCESS_TOKEN +
    # TRUFO_REFRESH_TOKEN (device-flow session), TRUFO_TEST_GP_ID.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
      - uses: hashicorp/setup-terraform@v3
      - name: Acceptance tests (test host + prod for AI systems)
        env:
          TF_ACC: 1
          TRUFO_API_KEY: ${{ secrets.TRUFO_TEST_API_KEY }}
          TRUFO_ACCESS_TOKEN: ${{ secrets.TRUFO_ACCESS_TOKEN }}
          TRUFO_REFRESH_TOKEN: ${{ secrets.TRUFO_REFRESH_TOKEN }}
          TRUFO_TEST_GP_ID: ${{ secrets.TRUFO_TEST_GP_ID }}
        run: go test ./internal/provider/ -run TestAcc -v -timeout 20m
