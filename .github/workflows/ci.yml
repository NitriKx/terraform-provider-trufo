name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache-dependency-path: |
            go.sum
            trufo-go/go.sum
      - name: Build
        run: go build ./...
      - name: Unit tests (provider)
        run: go test ./...
      - name: Unit tests (trufo-go)
        working-directory: trufo-go
        run: go test ./...
      - name: gofmt
        run: test -z "$(gofmt -l . trufo-go)"
      - name: go vet
        run: |
          go vet ./...
          (cd trufo-go && go vet ./...)

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
      - name: Generate docs and check they are up to date
        run: |
          go run github.com/hashicorp/terraform-plugin-docs/cmd/tfplugindocs
          test -z "$(git status --porcelain docs examples templates)"

  acceptance:
    # Manual only: needs Trufo test credentials as repository secrets.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
      - uses: hashicorp/setup-terraform@v3
      - name: Acceptance tests (test host)
        env:
          TF_ACC: 1
          TRUFO_API_KEY: ${{ secrets.TRUFO_TEST_API_KEY }}
          TRUFO_TEST_GP_ID: ${{ secrets.TRUFO_TEST_GP_ID }}
        run: go test ./internal/provider/ -run TestAcc -v -timeout 20m
